name: GDPR sweep

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdpr-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check sweep secrets configured
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "::error::SUPABASE_URL is not configured — member-gdpr-sweep target unknown (no hardcoded URL)"
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_CRON_SECRET }}" ]; then
            echo "::error::SUPABASE_CRON_SECRET is not configured — member-gdpr-sweep requires CRON_SECRET (fail-closed 401)"
            exit 1
          fi
      - name: Invoke member-gdpr-sweep edge function
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/gdpr-sweep-response.json"
          http_code="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --url "${{ secrets.SUPABASE_URL }}/functions/v1/member-gdpr-sweep" \
              --header "x-cron-secret: ${{ secrets.SUPABASE_CRON_SECRET }}" \
              --header "Content-Type: application/json" \
              --data '{}' \
              --output "$response_file" \
              --write-out '%{http_code}'
          )"
          echo "member-gdpr-sweep responded HTTP $http_code"
          cat "$response_file"